# Pipeline stages run in this order. A failed stage stops the ones after it.
stages:
  - test
  - scan
  - build
  - image-scan
  - release
  - deploy

variables:
  # pip downloads go in the project folder so GitLab can cache them between runs
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # one image name per commit, so every image traces back to its commit
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

test:
  stage: test
  # same Python version as the Dockerfile, so tests run where the app will run
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements-dev.txt   # new cache only when dependencies change
    paths:
      - .cache/pip
  script:
    - pip install -r requirements-dev.txt
    # fail the job if coverage drops under 90%
    - pytest --cov=app --cov-report=term --cov-fail-under=90
  # the regex tells GitLab where to read the coverage number in the log
  coverage: '/^TOTAL.+?(\d+\%)$/'

gitleaks:
  stage: scan
  # pinned version, so a new release can't change results under us
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]   # the image starts gitleaks by default, we want a shell
  variables:
    # GitLab clones only the last commit by default, but secrets can hide in old ones
    GIT_DEPTH: "0"
  script:
    # exit code 1 when a secret is found, which fails the job.
    # --redact hides the secret value in the log
    - gitleaks detect --source . --redact --verbose

semgrep:
  stage: scan
  # pinned, same reason as gitleaks
  image: semgrep/semgrep:1.179.0
  script:
    # p/python and p/flask are rule packs from the Semgrep registry.
    # --error makes findings fail the job, --metrics=off stops usage reporting
    - semgrep scan --config p/python --config p/flask --error --metrics=off .

trivy-deps:
  stage: scan
  image:
    name: aquasec/trivy:0.75.0
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
  script:
    # fs = scan files in the repo. Only requirements.txt matters here, because
    # requirements-dev.txt is test tooling and never ships in the image
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 requirements.txt

hadolint:
  stage: scan
  image: hadolint/hadolint:v2.15.1-alpine
  script:
    # lints the Dockerfile. Warnings and errors fail the job, style hints don't
    - hadolint --failure-threshold warning Dockerfile

checkov:
  stage: scan
  image:
    name: bridgecrew/checkov:3.3.22
    entrypoint: [""]
  script:
    # IaC scanner: the Dockerfile, the Kubernetes manifests in k8s/ and the Terraform in terraform/
    - checkov -d . --framework dockerfile --framework kubernetes --framework terraform --compact

build:
  stage: build
  # the docker client lives in this image, the daemon in the dind service below
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # dind generates TLS certs here and shares them with the client
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # CI_REGISTRY_* are filled in by GitLab, no password stored in the repo
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
    # the registry gives every pushed image a digest (a fingerprint of its exact content).
    # We save it so the deploy job can run that exact image, not just "whatever has this tag"
    - docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | sed 's/^/IMAGE_DIGEST=/' > build.env
  artifacts:
    reports:
      # dotenv turns the file into a variable, IMAGE_DIGEST, available in the later jobs
      dotenv: build.env

trivy-image:
  stage: image-scan
  image:
    name: aquasec/trivy:0.75.0
    entrypoint: [""]
  variables:
    # trivy pulls the image from our private registry, so it needs to log in
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  script:
    # first run only prints the report (exit code 0), so we always see HIGH and CRITICAL
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$IMAGE"
    # second run is the gate: any CRITICAL with a fix available fails the job
    - trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

release:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # only the main branch gets a latest tag, never test or feature branches
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # same image as the scanned one, just a second name for it
    - docker pull "$IMAGE"
    - docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  # runs on the runner installed on the laptop, the only one that can reach the kind cluster
  tags:
    - local-kind
  # only main deploys, and only after every earlier stage (tests, scans, release) passed
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # this image has kubectl; pinned, and the same minor version as the cluster (1.37)
  image:
    name: alpine/k8s:1.37.1
    entrypoint: [""]
  variables:
    # the cluster's address on the Docker network "kind", not a secret.
    # KUBE_TOKEN (the robot's key card) and KUBE_CA_FILE (the cluster's certificate)
    # come from GitLab CI variables, never from this repo
    KUBE_SERVER: "https://devsecops-control-plane:6443"
  script:
    # tell kubectl where the cluster is and who we are: the limited ci-deployer account
    - kubectl config set-cluster kind --server="$KUBE_SERVER" --certificate-authority="$KUBE_CA_FILE"
    - kubectl config set-credentials ci-deployer --token="$KUBE_TOKEN"
    - kubectl config set-context kind --cluster=kind --user=ci-deployer --namespace=task-tracker
    - kubectl config use-context kind
    # swap the template image line for the digest of the image we just built and scanned
    # (the pattern avoids a colon followed by a space: YAML would read that as a key and break the line)
    - sed "s|^\( *image:\) .*|\1 ${IMAGE_DIGEST}|" k8s/deployment.yaml > /tmp/deployment.yaml
    - grep "image:" /tmp/deployment.yaml
    # the namespace and the bootstrap folder are NOT applied here: the robot has no right to
    - kubectl apply -f k8s/pvc.yaml -f /tmp/deployment.yaml -f k8s/service.yaml -f k8s/networkpolicy.yaml
    # wait until the new pod is ready; the job fails if it isn't within 3 minutes
    - kubectl rollout status deployment/task-tracker --timeout=180s

trivy-sbom:
  stage: image-scan
  image:
    name: aquasec/trivy:0.75.0
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  script:
    # SBOM = a list of every package inside the image, in CycloneDX format
    - trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE"
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 30 days
