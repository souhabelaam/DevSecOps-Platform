# Pipeline stages run in this order. A failed stage stops the ones after it.
stages:
  - test

# pip downloads go in the project folder so GitLab can cache them between runs
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

test:
  stage: test
  # same Python version as the Dockerfile, so tests run where the app will run
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements-dev.txt   # new cache only when dependencies change
    paths:
      - .cache/pip
  script:
    - pip install -r requirements-dev.txt
    # fail the job if coverage drops under 90%
    - pytest --cov=app --cov-report=term --cov-fail-under=90
  # the regex tells GitLab where to read the coverage number in the log
  coverage: '/^TOTAL.+?(\d+\%)$/'
